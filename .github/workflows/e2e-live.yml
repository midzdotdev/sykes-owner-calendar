name: E2E live

# Smoke test against the real Sykes site, to catch upstream HTML/markup changes
# (like the relocated customer name) before users hit a broken calendar.
#
# Sykes blocks GitHub's datacenter IPs (the scrape returns 0 bookings from a
# hosted runner, regardless of User-Agent), so this can't run on a plain
# GitHub-hosted runner. Until it routes through a residential IP (Tailscale
# exit node) it is manual-only; run it locally with `npm run test:e2e:live`.
# The automatic push/cron triggers will be restored once tunnelling is set up.
on:
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: corepack enable
      - run: npm ci
      - run: npm run test:e2e:live
        env:
          SYKES_EMAIL: ${{ secrets.SYKES_EMAIL }}
          SYKES_PASSWORD: ${{ secrets.SYKES_PASSWORD }}
          SYKES_PROPERTY_ID: ${{ secrets.SYKES_PROPERTY_ID }}
