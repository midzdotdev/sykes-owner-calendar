name: E2E live

# Checks that the DEPLOYED app still serves a real calendar — catching upstream
# Sykes changes (auth failures, markup changes) before users do. It hits the
# production endpoint directly (Sykes does not block Vercel's IPs), so no tunnel
# or local build is needed. Weekly, plus on demand.
on:
  schedule:
    - cron: "0 6 * * 1" # 06:00 UTC every Monday
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: node test/e2e/live-prod.mjs
        env:
          PROD_URL: https://sykes-calendar.midz.dev
          SYKES_EMAIL: ${{ secrets.SYKES_EMAIL }}
          SYKES_PASSWORD: ${{ secrets.SYKES_PASSWORD }}
          SYKES_PROPERTY_ID: ${{ secrets.SYKES_PROPERTY_ID }}
