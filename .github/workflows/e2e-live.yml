name: E2E live

# Smoke test against the real Sykes site, to catch upstream HTML/markup changes
# (like the relocated customer name) before users hit a broken calendar.
# Runs on merge to main (validate each landed change against the live site) and
# weekly (catch Sykes-side changes during periods with no merges); also manual.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # 06:00 UTC every Monday
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: corepack enable
      - run: npm ci
      - run: npm run test:e2e:live
        env:
          SYKES_EMAIL: ${{ secrets.SYKES_EMAIL }}
          SYKES_PASSWORD: ${{ secrets.SYKES_PASSWORD }}
          SYKES_PROPERTY_ID: ${{ secrets.SYKES_PROPERTY_ID }}
