name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      # `npm ci` runs the `prepare` script (nitropack prepare), which generates
      # .nitro/types/tsconfig.json that the tests' tsconfig extends.
      - run: npm ci
      - run: npm test
